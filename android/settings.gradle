// Noxc Android · Gradle 设置
// 仓库不提交 gradle-wrapper.jar（二进制），CI 用 setup-gradle 装 Gradle 8.9 后
// 直接跑 `gradle assembleDebug`；Android Studio 打开本目录会自动补 wrapper。
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'Noxc'
include ':app'
