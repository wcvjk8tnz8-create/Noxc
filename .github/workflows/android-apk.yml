name: Build Noxc Android APK

# WebView 壳加载的是线上网页，前端改版不需要重新打包 APK。
# 所以只有 android/ 或本 workflow 变化时才触发；也可随时手动跑一次。
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'scripts/android-apk-regression.ts'
      - 'scripts/gen-android-icons.py'
  workflow_dispatch:
    inputs:
      site_url:
        description: '站点地址（留空用默认 https://nic.299282.xyz/）'
        required: false
        default: 'https://nic.299282.xyz/'
      create_release:
        description: '同时发布到 GitHub Releases（需已配置签名 Secrets）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像自带 Android SDK。第三方 setup-android action 会重新
      # 下载 cmdline-tools（在 runner 上直接失败），这里只探测已装 SDK 并补 PATH。
      - name: 定位 Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            for p in /usr/local/lib/android/sdk /opt/android-sdk "$HOME/Android/Sdk"; do
              if [ -d "$p" ]; then ANDROID_HOME="$p"; break; fi
            done
          fi
          test -n "$ANDROID_HOME" || { echo "::error::找不到 Android SDK"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          for d in "$ANDROID_HOME/cmdline-tools/latest/bin" \
                   "$ANDROID_HOME/cmdline-tools/tools/bin" \
                   "$ANDROID_HOME/tools/bin" "$ANDROID_HOME/platform-tools"; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH" && export PATH="$d:$PATH"
          done
          command -v sdkmanager || { echo "::error::sdkmanager 不在 PATH，SDK 布局异常"; exit 1; }
          sdkmanager --version > /tmp/sdk-version.txt 2>&1 || true
          head -5 /tmp/sdk-version.txt || true
          sdkmanager --list_installed > /tmp/sdk-list.txt 2>&1 || true
          head -20 /tmp/sdk-list.txt || true

      - name: Install Android 34 platform / build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          sdkmanager --list_installed > /tmp/sdk-list.txt 2>&1 || true
          grep -E 'android-34|34\.0\.0' /tmp/sdk-list.txt || true

      # 仓库不提交 gradle-wrapper.jar（二进制），直接下载官方 Gradle 8.9 发行版。
      # 不依赖任何 Gradle 官方 action，也就没有 wrapper 校验 / 缓存插件的不确定性。
      - name: Setup Gradle 8.9
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q -o "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/gradle-8.9/bin:$PATH"
          gradle --version > /tmp/gradle-v.txt 2>&1
          head -12 /tmp/gradle-v.txt
          java -version > /tmp/java-v.txt 2>&1 || true
          head -3 /tmp/java-v.txt || true

      - name: 准备 release 签名（没配 Secrets 就走 debug）
        id: sign
        env:
          KS_B64: ${{ secrets.NOXC_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.NOXC_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.NOXC_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.NOXC_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] && [ -n "$KS_KEY_PASS" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/android/app/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "✓ 已配置 release 签名"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置签名 Secrets → 构建 debug APK（可直接安装）"
          fi

      - name: 构建 APK
        env:
          SITE_URL: ${{ inputs.site_url || 'https://nic.299282.xyz/' }}
          NOXC_KEYSTORE: ${{ github.workspace }}/android/app/release.keystore
          NOXC_KEYSTORE_PASSWORD: ${{ secrets.NOXC_KEYSTORE_PASSWORD }}
          NOXC_KEY_ALIAS: ${{ secrets.NOXC_KEY_ALIAS }}
          NOXC_KEY_PASSWORD: ${{ secrets.NOXC_KEY_PASSWORD }}
        run: |
          cd android
          TASK=assembleDebug
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then TASK=assembleRelease; fi
          echo "▶ gradle $TASK  site=$SITE_URL  signed=${{ steps.sign.outputs.signed }}"
          gradle "$TASK" --no-daemon --stacktrace -PsiteUrl="$SITE_URL"

      - name: 校验 APK 产物
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' -type f -print -quit)
          if [ -z "$APK" ]; then echo "::error::没找到 APK"; exit 1; fi
          echo "APK=$APK"
          ls -lh "$APK"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          if [ ! -x "$BT/aapt" ]; then
            BT=$(dirname "$(find "$ANDROID_HOME/build-tools" -name aapt -type f -print -quit)")
          fi
          "$BT/aapt" dump badging "$APK" > /tmp/badging.txt 2>&1
          head -6 /tmp/badging.txt
          # aapt 只验清单，再验一次 ZIP 内容：必须有编译后的 dex / 资源表 / 图标，
          # 防止「格式合法但是个空壳」的 APK 被当成成功交付。
          python3 -c "
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1]); names = z.namelist()
          need = ['AndroidManifest.xml', 'classes.dex', 'resources.arsc']
          missing = [n for n in need if n not in names]
          png = sum(1 for n in names if n.endswith('.png'))
          print('APK entries:', len(names), '| PNG:', png,
                '| dex bytes:', z.getinfo('classes.dex').file_size if 'classes.dex' in names else 0)
          if missing or png < 6:
              print('::error::APK 内容不完整，缺', ','.join(missing), '图标', png); sys.exit(1)
          " "$APK"
          sha256sum "$APK"
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            "$BT/apksigner" verify --print-certs "$APK" > /tmp/certs.txt 2>&1
            head -8 /tmp/certs.txt
          fi

      - name: 上传 APK 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noxc-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: 发布到 GitHub Releases
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Noxc Android · build ${{ github.run_number }}
          body: |
            由 GitHub Actions 从 `${{ github.sha }}` 自动构建。

            - 站点地址：`${{ inputs.site_url || 'https://nic.299282.xyz/' }}`
            - 形态：Android WebView 壳，页面实时取自线上，前端更新无需重装
            - 安装前请在系统设置里允许「安装未知来源应用」
          files: android/app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
