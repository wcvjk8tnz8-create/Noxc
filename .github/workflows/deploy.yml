name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # ══════════════════════════════════════════════════════════
    #  Token 说明：CLOUDFLARE_API_TOKEN 与 CF_API_TOKEN 二选一
    #   - 只填 CLOUDFLARE_API_TOKEN → 部署和 DNS 都用这个
    #   - 只填 CF_API_TOKEN        → 部署和 DNS 都用这个
    #   - 两个都填                 → 各用各的（可给不同最小权限）
    #  下面这行做统一取值，后面所有步骤共用
    # ══════════════════════════════════════════════════════════
    env:
      CF_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 不启用 npm 缓存选项：该选项要求仓库里存在 package-lock.json；
          # 本项目不提交 lock（沙盒镜像无法生成），改用 npm install。

      # 仓库不跟踪 package-lock.json，因此不能用 npm ci（会因缺 lock 直接失败）。
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 校验必需配置是否齐全，缺什么直接说清楚
      - name: 检查配置
        run: |
          miss=0
          [ -z "$CF_AUTH_TOKEN" ] && { echo "✘ 缺少 API Token：请在 Secrets 里填 CLOUDFLARE_API_TOKEN 或 CF_API_TOKEN（二选一）"; miss=1; }
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && { echo "✘ 缺少 CLOUDFLARE_ACCOUNT_ID（Cloudflare 账户 ID）"; miss=1; }
          [ -z "$CF_ZONE_ID" ] && { echo "✘ 缺少 CF_ZONE_ID（根域名的 Zone ID）"; miss=1; }
          if [ "$miss" = "1" ]; then
            echo ""
            echo "设置入口：仓库 Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "✓ 两个 Token 都已配置，部署用 CLOUDFLARE_API_TOKEN、DNS 用 CF_API_TOKEN"
          else
            echo "✓ 已配置单个 Token，部署与 DNS 共用"
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

      # 类型检查：scripts/ 下的 .ts 运维脚本不参与 tsc（不在 include 内）。
      # 全量类型错误暂作提示，但 TS2304（未声明标识符）必须阻断：
      # esbuild / Vite 不做名字解析，这类代码能打包成功，线上运行时却直接抛
      # ReferenceError（例：后台保存设置里给未 import 的 brandPromise 赋值）。
      - name: 类型检查（TypeScript）
        run: |
          set +e
          # Runner 内置的 tsc problem matcher 会把日志里前 10 条 "error TSxxxx"
          # 自动转成红色 failure annotation，哪怕本步骤刻意非阻断，也会把
          # Job Summary 染成一片红。先注销 matcher，并把展示用的日志改写成
          # 非 "error" 格式；原始日志 /tmp/tsc.log 不变，阻断判定仍基于它。
          echo "::remove-matcher owner=tsc::"
          echo "::remove-matcher owner=typescript::"
          npm run typecheck > /tmp/tsc.log 2>&1
          code=$?
          sed -E 's/: error TS([0-9]+):/: typecheck TS\1:/g' /tmp/tsc.log
          if grep -qE 'error TS2304' /tmp/tsc.log; then
            grep -E 'error TS2304' /tmp/tsc.log | while IFS= read -r line; do echo "::error::$line"; done
            echo "✘ 存在未声明标识符：打包不会报错，但运行到该处必然抛 ReferenceError"
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "⚠ 其它类型问题（非阻断，退出码 $code）"
          fi

      # 固化历次线上踩过的坑：CSS 括号、词典重复键、明文密钥、零 HTML / 零 JS、
      # 弹窗遮罩 / Toast / 抽屉动效、双动效引擎、未声明标识符。
      - name: 静态健康巡检
        run: npx tsx scripts/health-check.ts

      # GitHub OAuth / Star 奖励：真跑 Hono 路由 + 内存 D1 + mock GitHub API
      - name: GitHub OAuth 回归
        run: npx tsx scripts/github-regression.ts

      # 按后缀每人注册次数：解析 / 累计 / 上限 / 已注册用户不受影响
      - name: 注册次数回归
        run: npx tsx scripts/root-limit-regression.ts

      # 首页 i18n：逐条抽取中文文案，断言英文模式零残留
      - name: 首页 i18n 回归
        run: npx tsx scripts/home-i18n-regression.ts

      # 注册邮箱规则纯函数回归：edu 漏洞已修 + @oauth.local 解封
      - name: 邮箱规则回归
        run: npx tsx scripts/email-rule-regression.ts


      # 真实 SQLite 回归：连续两次执行 schema.sql，确认用户案例展示开关不被抹掉
      - name: 用户案例持久化回归
        run: python3 scripts/schema-persistence.py

      # 用户案例展示奖励：首次开启 +6000、不叠加、不回收、并发去重、失败回滚
      - name: 用户案例展示奖励回归
        run: npx tsx scripts/showcase-reward-regression.ts

      # 有效期 / 续期窗口：默认取一半、随有效期联动、边界与文案不再写死 365/180
      - name: 有效期与续期回归
        run: npx tsx scripts/expiry-regression.ts

      # 修改密码改为邮箱验证码：发码/节流/一次性/场景隔离/会话与审计
      - name: 修改密码验证码回归
        run: npx tsx scripts/password-change-regression.ts

      # 站点公告：真跑 /api/config 下发 + 全站挂载链路 + 独立模板实拍
      - name: 站点公告回归
        run: npx tsx scripts/announcement-regression.ts

      # SPA 直达回落：/report /abuse 等路径直达不再 404 白屏
      - name: SPA 直达回落回归
        run: npx tsx scripts/spa-routes-regression.ts

      # /docs 改 VitePress 后曾因 ASSETS 规范化 + Worker 改写形成无限重定向
      - name: 服务文档重定向循环回归
        run: npx tsx scripts/docs-redirect-regression.ts

      # 按后缀单独暂停新申请：只拦新建，已注册域名与其它后缀不受影响
      - name: 按后缀暂停申请回归
        run: npx tsx scripts/root-apply-pause-regression.ts

      # 域名详情页「假切换」与 DNS 记录重复：整页切换 + 幂等 + 反向对照
      - name: 域名详情切换与记录重复回归
        run: npx tsx scripts/domain-switch-records-regression.ts

      # 按后缀暂停后「提交注册」必须真的点不动（按钮锁 + 四处拦截 + CSS 兜底）
      - name: 提交注册硬锁回归
        run: npx tsx scripts/apply-pause-lock-regression.ts

      # 暂停后缀不可见 / 不可点 / 自动切主推（含反向对照）
      - name: 暂停后缀可见性回归
        run: npx tsx scripts/paused-root-visibility-regression.ts

      # 第三方域名接入定版流程：gTLD 校验 / SEUS API 连接 / 站长审批 / 后端锁定
      - name: 第三方域名接入流程回归（gTLD → SEUS DNS → 站长批准）
        run: npx tsx scripts/external-domain-flow-regression.ts

      # D1 读取额度优化 + 第三方域名接入（快照 1 行 / Token 不落库 / 反向对照）
      - name: D1 读取与第三方域名回归
        run: npx tsx scripts/d1-read-external-domain-regression.ts

      - name: D1 读取第二轮回归（静态资源零 D1 / 配置统一缓存）
        run: npx tsx scripts/d1-read-phase2-regression.ts

      - name: 数据备份导出与汇入回归
        run: npx tsx scripts/backup-regression.ts

      - name: App 专用接口回归（bootstrap 聚合 / 字段同源 / 脱敏 / 契约）
        run: npx tsx scripts/app-api-regression.ts

      # iOS Universal 工程：双家族 / 三栏适配 / schema 同源 / 出包路径
      - name: iOS Universal IPA 回归
        run: npx tsx scripts/ios-ipa-regression.ts

      - name: AnyNS 管理 API 接入回归（n.ht 社区官方文档）
        run: npx tsx scripts/anyns-api-regression.ts

      # 该回归里用 node:sqlite 真跑 schema.sql 验证「迁移收尾」的幂等性，
      # Node 20 没有这个内置模块（Node 22.5+ 才有），临时切 24 只跑这一步，
      # 随后立刻切回 20，其余回归 / 构建 / 部署的运行时版本都不变。
      - name: 切换 Node 24（仅 AnyNS 迁移收尾回归）
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: meoy.top 暂停解析与站点级 AnyNS 后端回归
        run: npx tsx scripts/anyns-migration-regression.ts
      - name: 切回 Node 20（其余回归沿用既有版本）
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: SEUS DNS 接入回归（MCP Streamable HTTP）
        run: npx tsx scripts/seus-dns-regression.ts

      - name: NodeLoc 3.0 风格皮肤回归（全圆角 / 效果层 / 颜色保持）
        run: npx tsx scripts/nodeloc-skin-regression.ts

      # 手机 / 平板适配：静态断言必跑（浏览器逐元素实拍在 mobile-render.py，
      # CI 无 Chromium 时自动跳过，本地有 Playwright 时出明暗实拍图）。
      - name: 移动端适配回归（顶栏 / 触控 / 断点 / 表格横滚）
        run: npx tsx scripts/mobile-regression.ts

      # 安卓 App 配置（真编译在 android-apk.yml 里跑 assembleDebug/Release）
      - name: 安卓 APK 配置回归（XML / YAML / 图标 / 签名边界）
        run: npx tsx scripts/android-apk-regression.ts

      # 首页「已开通域名」可展开 + 最热后缀 HOT：真跑 SQLite 分组与 /api/config
      - name: 统计展开回归
        run: npx tsx scripts/stats-breakdown-regression.ts

      # 组合任务奖励（3000 积分）+ DC-XXXXXX 积分兑换码：真跑 lib / 路由 + 内存 D1
      - name: 组合任务奖励与 DC 积分码回归
        run: npx tsx scripts/rewards-regression.ts

      # DC 码真实用途：注册域名时抵扣。node:sqlite 真跑 schema.sql + 申请链路。
      # node:sqlite 在 Node 22.5+ 才内置、Node 23.4+/24 才默认无 flag 可用；
      # 本 job 默认 Node 20，这里临时切到 24 只跑这一步，随后立刻切回 20
      # 构建/部署，避免改动整条部署工具链的运行时版本。
      - name: 切换 Node 24（仅 DC 抵扣回归）
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: DC 码注册抵扣回归
        run: npx tsx scripts/discount-code-regression.ts
      - name: 切回 Node 20（构建与部署沿用既有版本）
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 响应速度优化 / 过渡动画移除：真跑预取复用 + 静态断言
      - name: 响应速度与过渡移除回归
        run: npx tsx scripts/perf-regression.ts

      # 构建 React 前端（产物 dist/client，由 wrangler [assets] 托管）
      # 日志端点有时被网络策略挡住，失败时把关键行同时发成 annotation 方便排查
      - name: 构建前端（Vite）
        run: |
          set +e
          npm run build > /tmp/vite-build.log 2>&1
          code=$?
          cat /tmp/vite-build.log
          if [ "$code" -ne 0 ]; then
            grep -iE "error|failed|cannot|could not|not exported|not defined|\[vite" /tmp/vite-build.log \
              | tail -25 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$code"
          fi

      # D1 数据库：存在就复用，不存在自动创建，并把 uuid 传给下一步
      - name: 准备 D1 数据库
        run: npx tsx scripts/ensure-d1.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}

      # R2 存储桶：存在就复用，不存在自动创建（用于自定义头像上传）
      # 头像默认走 Worker 的 /api/avatar/<key> 代理，本身即公网可访问，不需要 R2 公开访问
      # 如需外链直连，可在 Variables 里填 R2_CUSTOM_DOMAIN（如 img.meoy.top）
      # 注意：用 always() 放行 —— R2 准备失败时脚本会自动移除绑定并降级，
      # 站点功能不受影响（仅上传自定义头像不可用），不应阻断部署。
      - name: 准备 R2 存储桶
        continue-on-error: true
        run: npx tsx scripts/ensure-r2.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROOT_DOMAINS: ${{ vars.ROOT_DOMAINS }}
          CF_ZONE_IDS: ${{ vars.CF_ZONE_IDS }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_CUSTOM_DOMAIN: ${{ vars.R2_CUSTOM_DOMAIN }}
          R2_ASSUME_EXISTS: ${{ vars.R2_ASSUME_EXISTS }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

      # KV namespace：存在就复用，不存在自动创建，并把 id 写入 wrangler.toml
      # 与 D1 / R2 同一套约定：失败自动移除绑定并降级，不阻断部署。
      - name: 准备 KV namespace
        continue-on-error: true
        run: npx tsx scripts/ensure-kv.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_TITLE: ${{ vars.KV_NAMESPACE_TITLE }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}

      # 绑定状态巡检：只打印，不阻断（KV / R2 都允许降级）
      - name: 检查绑定状态
        run: |
          echo "── wrangler.toml 绑定 ──"
          grep -E '^\[\[(d1_databases|r2_buckets|kv_namespaces)\]\]|^binding =|^bucket_name =|^id =' wrangler.toml || true
          {
            echo "### 本次部署的 wrangler.toml 绑定"
            echo '```'
            grep -E '^\[\[(d1_databases|r2_buckets|kv_namespaces)\]\]|^binding =|^bucket_name =|^id =' wrangler.toml || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q '^\[\[kv_namespaces\]\]' wrangler.toml || echo "::warning::本次部署没有 KV 绑定（原因见上方「准备 KV namespace」步骤）"
          grep -q '^\[\[r2_buckets\]\]' wrangler.toml || echo "::warning::本次部署没有 R2 绑定（原因见上方「准备 R2 存储桶」步骤）"

      # 把 Variables 写进 wrangler.toml
      # database_id 由上一步自动写入环境，此处不再覆盖
      - name: 注入配置
        run: npx tsx scripts/inject-config.ts
        env:
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          DEFAULT_QUOTA: ${{ vars.DEFAULT_QUOTA }}
          ALLOW_SIGNUP: ${{ vars.ALLOW_SIGNUP }}
          REQUIRE_APPROVAL: ${{ vars.REQUIRE_APPROVAL }}
          RESERVED_LABELS: ${{ vars.RESERVED_LABELS }}
          CF_MOCK: ${{ vars.CF_MOCK }}
          ROOT_DOMAINS: ${{ vars.ROOT_DOMAINS }}
          CF_ZONE_IDS: ${{ vars.CF_ZONE_IDS }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          AVATAR_MAX_KB: ${{ vars.AVATAR_MAX_KB }}

      # 敏感值写入 Worker 的加密环境变量（等同 wrangler secret put）
      # DNSHE_API_KEY / DNSHE_API_SECRET 为可选项：不填则退回公开模式
      - name: 写入 Worker Secrets
        run: |
          set -e
          printf '%s' "$CF_API_TOKEN" | npx wrangler secret put CF_API_TOKEN >/dev/null
          printf '%s' "$CF_ZONE_ID"   | npx wrangler secret put CF_ZONE_ID   >/dev/null
          echo "✓ 已写入 CF_API_TOKEN、CF_ZONE_ID"
          if [ -n "$DNSHE_API_KEY" ] && [ -n "$DNSHE_API_SECRET" ]; then
            printf '%s' "$DNSHE_API_KEY"    | npx wrangler secret put DNSHE_API_KEY    >/dev/null
            printf '%s' "$DNSHE_API_SECRET" | npx wrangler secret put DNSHE_API_SECRET >/dev/null
            echo "✓ 已写入 DNSHE_API_KEY、DNSHE_API_SECRET（DNSHE 域名查询走认证模式）"
          else
            echo "• 未配置 DNSHE 凭证，DNSHE 域名查询走公开模式（2 次/分钟/IP）"
          fi
          # AnyNS（n.ht 社区）管理令牌：站点后端用它给根域名 zone 写记录。
          # 可选：不填则 meoy.top 仍走原 DNS 后端，部署不中断。
          if [ -n "$ANYNS_API_TOKEN" ]; then
            printf '%s' "$ANYNS_API_TOKEN" | npx wrangler secret put ANYNS_API_TOKEN >/dev/null
            echo "✓ 已写入 ANYNS_API_TOKEN（meoy.top 记录下发走 AnyNS 管理 API）"
          else
            echo "• 未配置 ANYNS_API_TOKEN，meoy.top 记录仍走原 DNS 后端"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ env.CF_AUTH_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          DNSHE_API_KEY: ${{ secrets.DNSHE_API_KEY }}
          DNSHE_API_SECRET: ${{ secrets.DNSHE_API_SECRET }}
          ANYNS_API_TOKEN: ${{ secrets.ANYNS_API_TOKEN }}

      # 建表（幂等：CREATE TABLE IF NOT EXISTS，重复部署不会丢数据）
      # /docs 改由 VitePress 静态站提供，确认产物已并入 Worker 静态目录
      - name: 校验 VitePress 文档产物
        run: |
          test -f dist/client/docs/index.html || { echo "::error::缺少 dist/client/docs/index.html"; exit 1; }
          test -f dist/client/docs/quick-start.html || { echo "::error::缺少中文文档页"; exit 1; }
          test -f dist/client/docs/en/index.html || { echo "::error::缺少英文文档页"; exit 1; }
          test -f docs-src/img/fig7.png || { echo "::error::缺少 DNSHE 截图源文件"; exit 1; }
          pngs=$(find dist/client/docs -type f \( -name '*.png' -o -name '*.webp' \) | wc -l)
          test "$pngs" -ge 8 || { echo "::error::VitePress 产物里只有 $pngs 张图，应有 8 张"; exit 1; }
          echo "✓ VitePress 产物齐全（中英首页 + $pngs 张图）"

      - name: 初始化 D1 表结构
        run: npx wrangler d1 execute "${D1_DATABASE_NAME}" --remote --file=./schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || 'subdomain-hub-db' }}

      - name: 部署 Worker（含静态资源）
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
